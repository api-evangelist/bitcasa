name: Bitcasa
description: 'Bitcasa, Inc. was an American cloud storage company (founded 2011 in St. Louis,
  Missouri; later based in Mountain View, California) known for its converged/infinite storage
  model and, for developers, the CloudFS API — a white-label cloud-storage platform that let
  third-party applications integrate file management, secure sharing, media transcoding, instant
  streaming, and zero-knowledge client-side encryption. Backed by Andreessen Horowitz (a16z),
  CrunchFund, Pelion Venture Partners, Horizons Ventures, Samsung Ventures, and First Round
  Capital, Bitcasa wound down its consumer Bitcasa Drive service in 2016 and shut down all
  services in 2017. The company is defunct and the bitcasa.com domain is now parked, so no live
  developer surface, API documentation, or specifications remain to enrich.'
